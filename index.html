<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("miniMartSettings") || "null");
          const theme = saved?.theme === "dark" || saved?.theme === "light"
            ? saved.theme
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Mini Mart POS</title>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/checkout.css" />
  </head>

  <body class="checkout-page">
    <div class="shell">
      <!-- =========================
           HEADER / SIDEBAR
      ========================== -->
      <header>
        <div>
          <div class="brand">
            <div class="brand-mark">
              <img src="Icons/grocery-store.png" alt="Mini Mart" />
            </div>

            <div>
              <div class="eyebrow">REGISTER 01</div>
              <h1>Mini Mart</h1>
            </div>
          </div>

          <button
            class="mobile-menu-button"
            type="button"
            aria-expanded="false"
            aria-controls="mainNavigation"
          >
            ☰ <span>MENU</span>
          </button>

          <nav id="mainNavigation" aria-label="Main navigation">
            <a class="active" href="index.html"> ⌑ CHECKOUT </a>

            <a href="inventory.html"> ◈ INVENTORY </a>

            <a href="reports.html"> ▥ REPORTS </a>

            <a class="suki-link" href="suki-reward.html"> ♡ SUKI REWARDS </a>

            <a href="settings.html"> ⚙ SETTINGS </a>

            <button class="mobile-logout" id="mobileLogoutButton" type="button">
              ↪ LOG OUT
            </button>
          </nav>
        </div>

        <button class="sidebar-logout" id="logoutButton" type="button">
          ↪ LOG OUT
        </button>

        <div class="date" aria-label="Current date"></div>
      </header>

      <!-- =========================
           CHECKOUT WORKSPACE
      ========================== -->
      <main class="workspace">
        <!-- PRODUCT SEARCH -->
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>

          <input
            id="search"
            type="search"
            placeholder="Search products..."
            aria-label="Search products"
            name="mini-mart-product-search"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
        </div>

        <!-- =========================
             PRODUCTS
             Products are generated
             by checkout.js
        ========================== -->
        <section class="products" id="products" aria-label="Products">
          <!--
            checkout.js will generate
            the product categories and cards here.
          -->

          <div class="empty-results" id="emptyResults">No products found.</div>
        </section>

        <!-- =========================
             RECEIPT / CART
        ========================== -->
        <section class="receipt" aria-label="Shopping cart">
          <!-- RECEIPT HEADER -->
          <div class="receipt-top">
            <div class="receipt-title">▣ MINI MART</div>

            <div class="receipt-date" id="receiptDate"></div>
          </div>

          <!-- EMPTY CART -->
          <div class="cart-empty" id="cartEmpty">
            <div class="cart-icon">
              <img src="Icons/grocery-store.png" alt="Shopping cart" />
            </div>

            <div>Cart is empty</div>
          </div>

          <!-- CART ITEMS -->
          <div class="cart-items" id="cartItems"></div>

          <!-- TOTAL -->
          <div class="total" id="total" hidden>
            <span> TOTAL </span>

            <strong id="totalAmount"> &#8369;0.00 </strong>
          </div>

          <!-- =========================
               PAYMENT PANEL

               IMPORTANT:
               Suki Rewards is NOT written
               directly into this HTML.

               checkout.js dynamically adds
               the Suki Rewards controls here.
          ========================== -->
          <div class="payment-panel" id="paymentPanel" hidden>
            <!--
              checkout.js creates:

              Suki Rewards
              [ Tap Suki's Card ]

              Customer information

              Reward amount

              inside this payment panel.
            -->

            <!-- CUSTOMER PAYMENT -->
            <label for="amountGiven"> CUSTOMER GIVES </label>

            <div class="payment-input-wrap">
              <span> &#8369; </span>

              <input
                id="amountGiven"
                type="number"
                min="0"
                step="0.01"
                placeholder="0.00"
                inputmode="decimal"
              />
            </div>

            <!-- CHANGE -->
            <div class="change-row">
              <span> CHANGE </span>

              <strong id="changeAmount"> &#8369;0.00 </strong>
            </div>

            <!-- PAYMENT ERROR -->
            <p class="payment-error" id="paymentError" hidden>
              Payment is less than the total.
            </p>
          </div>

          <!-- SELL -->
          <button class="sell-button" id="sellButton" type="button" disabled>
            SELL
          </button>
        </section>
      </main>
    </div>

    <!-- =========================
         SCRIPTS
    ========================== -->

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Authentication -->
    <script src="js/auth-client.js"></script>
    <script src="js/settings-store.js"></script>

    <!-- Database -->
    <script src="js/database.js"></script>

    <!-- Shared NFC scanning -->
    <script src="js/nfc.js"></script>

    <!-- Checkout + Suki Rewards -->
    <script src="js/checkout.js"></script>

    <!-- Navigation -->
    <script src="js/navigation.js"></script>
  </body>
</html>
